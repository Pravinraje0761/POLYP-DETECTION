name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # headless OpenCV avoids needing a display library on the runner
          grep -v '^opencv-python' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt opencv-python-headless pytest ruff
          pip install -e .

      - name: Lint (correctness checks only)
        run: ruff check .

      - name: Every file compiles, including archive/
        run: python -m compileall -q src experiments archive tests

      - name: Tests
        run: pytest -q
